<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>有約</title>
<meta name="description" content="見一面，好好約。寫張卡片，或開一張時間表——日子、地點，都留到之後再說。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@500;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
<style id="app-style"></style>
</head>
<body>
<div class="stage" aria-hidden="true"><div class="stage__img" id="bgA"></div><div class="stage__img" id="bgB"></div><div class="stage__scrim"></div><div class="stage__vig"></div></div>
<div class="grain" aria-hidden="true"></div>
<div id="app" class="wrap"></div>
<script>
(function () {
  "use strict";

  /* ================= remote storage ==================
     jsonblob.com — free, no signup, CORS-enabled public JSON store, used as the
     shared backend so two browsers on the same link stay in sync. These four
     functions are the ONLY place this app touches the network; swap them if you
     want to point at your own API instead. */
  var BLOB_API = "https://jsonblob.com/api/jsonBlob";
  var POLL_MS = 5000;
  var blobId = null;
  var pollTimer = null;
  var lastFailedSync = null;

  function getIdFromUrl() {
    var m = location.search.match(/[?&]id=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : null;
  }
  function setIdInUrl(id) {
    var u = new URL(location.href);
    u.searchParams.set("id", id);
    history.replaceState(null, "", u.toString());
  }
  function fetchRemote(id) {
    return fetch(BLOB_API + "/" + encodeURIComponent(id), { headers: { Accept: "application/json" } })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  }
  function createRemote(stateObj) {
    return fetch(BLOB_API, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(stateObj) })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        var loc = r.headers.get("Location") || r.headers.get("location");
        var id = loc ? loc.split("/").filter(Boolean).pop() : null;
        if (!id) throw new Error("伺服器沒有回傳連結編號");
        return id;
      });
  }
  function putRemote(id, stateObj) {
    return fetch(BLOB_API + "/" + encodeURIComponent(id), { method: "PUT", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(stateObj) })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); });
  }

  /* ================= design system ================= */
  var GRAIN = "url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27140%27%20height=%27140%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%270.85%27%20numOctaves=%273%27%20stitchTiles=%27stitch%27/%3E%3C/filter%3E%3Crect%20width=%27140%27%20height=%27140%27%20filter=%27url(%23n)%27/%3E%3C/svg%3E)";

  var CSS_TEXT = [
    "*,*::before,*::after{box-sizing:border-box;}",
    "html,body{margin:0;padding:0;}",
    "button,input,textarea,select{font:inherit;color:inherit;}",
    "button{background:none;border:none;cursor:pointer;text-align:inherit;}",
    "ul,ol{list-style:none;margin:0;padding:0;}",
    "h1,h2,h3,p{margin:0;}",
    "a{color:inherit;}",

    /* ---------- tokens: one committed look — film still + cream stationery ---------- */
    ":root{",
    "--night:#0c0b0a;",
    "--paper:#f7f1e5;--paper-2:#ece3d2;--paper-3:#ded2bc;",
    "--ink:#1a1714;--ink-2:#6b6153;--ink-3:#a2977f;--rule:#d8cdb8;--rule-soft:#e8dfcd;",
    "--terra:#bf5629;--terra-2:#9d4520;--terra-tint:#f6e3d8;",
    "--slate:#7a8fa3;--slate-deep:#465768;--gold:#b5893a;",
    "--glow:#f3e9da;--glow-2:rgba(243,233,218,.72);--glow-3:rgba(243,233,218,.42);",
    "--cat-meal:#b7622f;--cat-ktv:#8a5f96;--cat-boardgame:#b58a33;--cat-cafe:#2f7370;",
    "--cat-outdoor:#6c8560;--cat-movie:#4a6b91;--cat-sport:#bf5629;--cat-art:#a86379;",
    "--print:5px 6px 0 rgba(8,7,6,.34);",
    "--print-lift:9px 11px 0 rgba(8,7,6,.4);",
    "--drop:0 20px 46px rgba(6,5,4,.55);",
    "--heat-base:var(--paper-2);--heat-full:var(--terra);",
    "}",

    /* ---------- the stage: a different film still behind every screen ---------- */
    "body{background:var(--night);color:var(--glow);font-family:'Jost','Noto Sans TC','PingFang TC',sans-serif;font-weight:400;line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh;}",
    ".stage{position:fixed;inset:0;z-index:-2;overflow:hidden;background:var(--night);}",
    ".stage__img{position:absolute;inset:-4%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.1s ease;transform:scale(1.05);will-change:opacity,transform;}",
    ".stage__img.on{opacity:1;animation:drift 46s ease-in-out infinite alternate;}",
    "@keyframes drift{from{transform:scale(1.05) translate(0,0);}to{transform:scale(1.14) translate(-1.6%,-1.2%);}}",
    ".stage__scrim{position:absolute;inset:0;background:linear-gradient(178deg,rgba(10,9,8,.80) 0%,rgba(10,9,8,.46) 30%,rgba(10,9,8,.52) 62%,rgba(10,9,8,.88) 100%);}",
    ".stage__vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 34%,rgba(6,5,4,.62) 100%);}",
    ".grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.30;mix-blend-mode:overlay;background-image:" + GRAIN + ";}",
    "@media (prefers-reduced-motion:reduce){.stage__img.on{animation:none;}}",

    ".wrap{max-width:624px;margin:0 auto;padding:24px 22px 96px;position:relative;z-index:1;}",
    "@media (max-width:560px){.wrap{padding:16px 15px 72px;}}",

    /* ---------- type ---------- */
    ".mono{font-family:'IBM Plex Mono','Noto Sans TC',monospace;}",
    ".arch{border-radius:999px 999px 5px 5px;}",

    /* ---------- topbar (sits on the photo) ---------- */
    ".topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid rgba(243,233,218,.20);margin-bottom:26px;}",
    ".brand{display:inline-flex;align-items:center;gap:9px;font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.71rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--glow);}",
    ".brand__dot{width:8px;height:8px;background:var(--terra);flex:none;transform:rotate(45deg);}",
    ".label{font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.2em;color:var(--glow-3);}",
    ".back-link{font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.67rem;font-weight:500;letter-spacing:.14em;color:var(--glow-2);border:1px solid rgba(243,233,218,.3);padding:6px 13px;background:rgba(12,11,10,.32);backdrop-filter:blur(6px);transition:color .18s,border-color .18s,background .18s;}",
    ".back-link:hover{color:var(--night);border-color:var(--glow);background:var(--glow);}",

    /* ---------- banner (dark glass on photo) ---------- */
    ".banner{border:1px solid rgba(243,233,218,.22);border-left:3px solid var(--glow-3);background:rgba(14,12,11,.62);backdrop-filter:blur(10px);padding:12px 16px;margin-bottom:20px;font-size:.85rem;color:var(--glow-2);}",
    ".banner--warn{border-left-color:var(--gold);}",
    ".banner--error{border-left-color:var(--terra);color:#f0c3b1;}",

    /* ---------- hero (on the photo) ---------- */
    ".orn{display:flex;align-items:center;gap:12px;color:var(--glow-3);margin:0 auto 16px;max-width:250px;}",
    ".orn::before,.orn::after{content:'';flex:1;height:1px;background:rgba(243,233,218,.32);}",
    ".orn__mark{font-size:.55rem;letter-spacing:.34em;}",
    ".hero{text-align:center;padding:22px 4px 34px;}",
    ".hero--sub{text-align:left;padding:4px 0 24px;}",
    ".hero__kicker{font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.65rem;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:#e6a184;margin-bottom:16px;}",
    ".epigraph{font-family:'Noto Serif TC','Jost',serif;font-style:italic;font-weight:400;font-size:.88rem;line-height:1.65;color:var(--glow-2);margin:0 0 16px;text-shadow:0 1px 14px rgba(6,5,4,.6);}",
    ".epigraph--center{text-align:center;}",
    ".epigraph--lead{font-size:1.28rem;line-height:1.8;margin:0;}",
    "@media (max-width:560px){.epigraph--lead{font-size:1.08rem;}}",
    ".epigraph cite{font-style:normal;font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.62rem;letter-spacing:.14em;color:var(--gold);margin-left:6px;}",
    ".epigraph--lead cite{display:block;margin:10px 0 0;}",
    ".hero--lead{padding:52px 4px 58px;}",
    ".hero__title{font-family:'Jost','Noto Serif TC',serif;font-weight:900;font-size:2.45rem;line-height:1.2;letter-spacing:.005em;text-wrap:balance;margin-bottom:13px;color:var(--glow);text-shadow:0 2px 22px rgba(6,5,4,.62);}",
    "@media (max-width:560px){.hero__title{font-size:1.92rem;}}",
    ".hero__sub{color:var(--glow-2);font-size:.92rem;font-weight:300;max-width:32em;margin:0 auto;text-shadow:0 1px 14px rgba(6,5,4,.6);}",
    ".hero--sub .hero__sub{margin:0;}",
    ".hero__tag{display:inline-flex;align-items:center;gap:8px;font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.67rem;font-weight:500;letter-spacing:.16em;color:var(--glow);border:1px solid rgba(243,233,218,.32);padding:6px 13px;margin-bottom:15px;background:rgba(12,11,10,.34);backdrop-filter:blur(6px);}",

    /* ---------- picker cards: cream stationery with an arch tile ---------- */
    ".pick-grid{display:grid;gap:13px;grid-template-columns:1fr 1fr;}",
    "@media (max-width:420px){.pick-grid{grid-template-columns:1fr;}}",
    ".pick{position:relative;background:var(--paper);border:1px solid var(--rule);padding:22px 14px 18px;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;color:var(--ink);box-shadow:var(--print);transition:transform .22s cubic-bezier(.2,.8,.3,1),box-shadow .22s,border-color .22s;}",
    ".pick:hover{transform:translate(-2px,-3px);box-shadow:var(--print-lift);border-color:var(--ink-3);}",
    ".pick:focus-visible{outline:2px solid var(--glow);outline-offset:3px;}",
    ".pick__no{position:absolute;top:8px;left:11px;font-family:'IBM Plex Mono',monospace;font-size:.6rem;font-weight:600;letter-spacing:.12em;color:var(--ink-3);}",
    ".pick__icon{width:52px;height:62px;border-radius:999px 999px 4px 4px;display:flex;align-items:center;justify-content:center;font-size:1.45rem;background:color-mix(in srgb,var(--tone) 17%,var(--paper));border:1px solid color-mix(in srgb,var(--tone) 42%,transparent);transition:background .22s,border-color .22s,color .22s;}",
    ".pick__title{font-family:'Jost','Noto Serif TC',serif;font-weight:700;font-size:1rem;letter-spacing:.015em;}",
    ".pick__cap{font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.66rem;font-weight:400;color:var(--ink-2);line-height:1.55;}",
    ".pick--on{border-color:var(--ink);box-shadow:var(--print-lift);background:var(--paper-2);}",
    ".pick--on .pick__icon{background:var(--tone);border-color:var(--tone);}",
    ".pick--on .pick__no::after{content:'\\00a0\\00a0\\2713';color:var(--terra);font-weight:700;}",

    /* ---------- film strip progress ---------- */
    ".film{background:#191512;padding:5px 6px;display:flex;align-items:center;gap:4px;position:relative;}",
    ".film::before,.film::after{content:'';position:absolute;left:6px;right:6px;height:4px;background-image:radial-gradient(circle at 3px 2px,var(--paper) 1.5px,transparent 1.8px);background-size:10px 4px;background-repeat:repeat-x;opacity:.5;}",
    ".film::before{top:0;}",
    ".film::after{bottom:0;}",
    ".film__cell{flex:1;height:14px;background:rgba(247,241,229,.11);transition:background .3s;}",
    ".film__cell.done{background:rgba(247,241,229,.42);}",
    ".film__cell.now{background:var(--terra);}",

    /* ---------- sheet (wizard / form card) ---------- */
    ".sheet{background:var(--paper);border:1px solid var(--rule);color:var(--ink);box-shadow:var(--drop);margin-top:4px;animation:rise .42s cubic-bezier(.2,.8,.3,1) both;}",
    "@keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}",
    ".sheet__slate{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 16px;background:#191512;color:var(--paper);font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.65rem;font-weight:500;letter-spacing:.17em;text-transform:uppercase;}",
    ".sheet__slate b{font-weight:600;color:#f0b18f;}",
    ".sheet__body{padding:26px 24px 22px;}",
    "@media (max-width:560px){.sheet__body{padding:22px 17px 18px;}}",
    ".sheet__q{font-family:'Jost','Noto Serif TC',serif;font-weight:900;font-size:1.48rem;line-height:1.34;text-wrap:balance;margin-bottom:6px;}",
    "@media (max-width:560px){.sheet__q{font-size:1.26rem;}}",
    ".sheet__hint{color:var(--ink-2);font-size:.82rem;font-weight:300;margin-bottom:18px;}",
    ".sheet__nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;padding-top:16px;border-top:1px solid var(--rule-soft);}",

    /* ---------- fields ---------- */
    ".fld{width:100%;background:var(--paper-2);border:1px solid var(--rule-soft);border-bottom:2px solid var(--rule);padding:11px 13px;font-size:.96rem;margin-bottom:14px;color:var(--ink);transition:border-color .18s,background .18s;}",
    ".fld::placeholder{color:var(--ink-3);font-weight:300;}",
    ".fld:focus{outline:none;border-bottom-color:var(--terra);background:#fffdf8;}",
    "textarea.fld{min-height:80px;resize:vertical;line-height:1.6;}",
    ".fld-label{display:block;font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.65rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px;}",
    ".fld-label .opt{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink-3);}",
    ".err{color:var(--terra-2);font-size:.81rem;min-height:1.15em;margin:-6px 0 8px;font-weight:500;}",

    /* ---------- buttons ---------- */
    ".btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;font-family:'Jost','Noto Sans TC',sans-serif;font-weight:600;font-size:.91rem;letter-spacing:.04em;border:1px solid transparent;text-decoration:none;transition:transform .14s,box-shadow .18s,background .18s,color .18s,border-color .18s;}",
    ".btn:active{transform:translate(1px,1px);}",
    ".btn:focus-visible{outline:2px solid var(--terra);outline-offset:3px;}",
    ".btn--go{background:var(--ink);color:var(--paper);box-shadow:4px 4px 0 var(--terra);}",
    ".btn--go:hover{box-shadow:6px 6px 0 var(--terra);}",
    ".btn--ghost{background:transparent;border-color:var(--rule);color:var(--ink);}",
    ".btn--ghost:hover{border-color:var(--ink);background:var(--paper-2);}",
    ".btn--quiet{padding:7px 4px;font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.7rem;font-weight:500;letter-spacing:.12em;color:var(--ink-2);}",
    ".btn--quiet:hover{color:var(--ink);}",
    ".btn--cal{background:var(--terra);color:var(--paper);border-color:var(--terra);box-shadow:4px 4px 0 rgba(26,23,20,.22);}",
    ".btn--cal:hover{background:var(--terra-2);border-color:var(--terra-2);}",
    ".btn--sm{padding:8px 15px;font-size:.79rem;}",
    ".btn--wide{width:100%;}",
    /* a primary button standing directly on the photo */
    ".btn--onphoto{background:var(--paper);color:var(--ink);box-shadow:5px 5px 0 rgba(8,7,6,.4);border-color:var(--paper);}",
    ".btn--onphoto:hover{background:#fff;box-shadow:7px 7px 0 rgba(8,7,6,.46);}",

    /* ---------- chips ---------- */
    ".chips{display:flex;flex-wrap:wrap;gap:7px;}",
    ".chip{border:1px solid var(--rule);background:var(--paper-2);color:var(--ink);padding:8px 14px;font-size:.85rem;transition:background .16s,border-color .16s,color .16s,transform .12s;}",
    ".chip:hover{border-color:var(--ink-3);transform:translateY(-1px);}",
    ".chip:focus-visible{outline:2px solid var(--terra);outline-offset:2px;}",
    ".chip[aria-pressed='true']{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:500;}",
    ".chip[aria-pressed='true']::before{content:'\\2713\\00a0';font-size:.78em;color:#f0b18f;}",
    ".chip-mini{display:inline-block;border:1px solid var(--rule);background:var(--paper-2);padding:2px 8px;font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.67rem;color:var(--ink-2);}",

    /* ---------- time pills (ticket stubs) ---------- */
    ".times{display:flex;flex-wrap:wrap;gap:8px;}",
    ".time{position:relative;border:1px solid var(--rule);background:var(--paper-2);color:var(--ink);padding:10px 15px 10px 18px;text-align:left;min-width:126px;transition:background .16s,border-color .16s,color .16s,transform .12s;}",
    ".time::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:1px;border-left:1px dashed var(--ink-3);}",
    ".time:hover{border-color:var(--ink-3);transform:translateY(-1px);}",
    ".time b{display:block;font-family:'IBM Plex Mono',monospace;font-size:1.02rem;font-weight:600;}",
    ".time span{display:block;font-size:.71rem;color:var(--ink-2);font-weight:300;}",
    ".time[aria-pressed='true']{background:var(--ink);border-color:var(--ink);color:var(--paper);}",
    ".time[aria-pressed='true'] span{color:rgba(247,241,229,.7);}",
    ".time[aria-pressed='true']::before{border-left-color:var(--terra);}",

    /* ---------- calendar ---------- */
    ".cal{max-width:330px;margin:2px 0 4px;}",
    ".cal__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}",
    ".cal__month{font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.79rem;font-weight:600;letter-spacing:.11em;}",
    ".cal__nav{width:28px;height:28px;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;font-size:.92rem;flex:none;transition:background .16s,border-color .16s,color .16s;}",
    ".cal__nav:hover{background:var(--ink);border-color:var(--ink);color:var(--paper);}",
    ".cal__wd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.62rem;letter-spacing:.09em;color:var(--ink-3);padding-bottom:5px;border-bottom:1px solid var(--rule-soft);margin-bottom:5px;}",
    ".cal__grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}",
    ".cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:.81rem;color:var(--ink-3);transition:background .15s,color .15s;}",
    ".cal-cell--empty{visibility:hidden;}",
    "button.cal-cell{color:var(--ink);border-radius:999px 999px 3px 3px;}",
    "button.cal-cell:hover{background:var(--paper-3);}",
    "button.cal-cell.today{box-shadow:inset 0 0 0 1px var(--terra);color:var(--terra-2);}",
    "button.cal-cell.on{background:var(--ink);color:var(--paper);font-weight:600;box-shadow:none;}",

    /* ---------- date chips + per-day ---------- */
    ".datechips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;}",
    ".datechip{display:inline-flex;align-items:center;gap:7px;background:var(--ink);color:var(--paper);padding:5px 7px 5px 12px;font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.73rem;font-weight:500;}",
    ".datechip__x{width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;background:rgba(247,241,229,.2);font-size:.74rem;line-height:1;}",
    ".datechip__x:hover{background:var(--terra);}",
    ".perday{display:flex;flex-direction:column;gap:7px;margin-top:11px;}",
    ".perday__row{display:flex;align-items:center;gap:9px;background:var(--paper-2);border:1px solid var(--rule-soft);padding:7px 11px;flex-wrap:wrap;}",
    ".perday__date{flex:1 1 auto;font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.78rem;font-weight:500;}",
    ".perday__sep{color:var(--ink-3);}",
    ".perday__t{background:var(--paper);border:1px solid var(--rule);padding:5px 7px;font-family:'IBM Plex Mono',monospace;font-size:.79rem;}",

    /* ---------- sections ---------- */
    ".sec{background:var(--paper);border:1px solid var(--rule);color:var(--ink);box-shadow:var(--drop);padding:22px 22px 20px;margin-bottom:16px;}",
    "@media (max-width:560px){.sec{padding:18px 15px 16px;}}",
    ".sec__head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:9px;border-bottom:1px solid var(--rule);margin-bottom:15px;}",
    ".sec__title{font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.72rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;}",
    ".sec__hint{color:var(--ink-2);font-size:.76rem;font-weight:300;}",
    ".sec__sub{font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.68rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);margin:18px 0 8px;padding-left:9px;border-left:2px solid var(--tone,var(--terra));}",
    ".sec__sub:first-child{margin-top:0;}",
    ".none{color:var(--ink-3);font-size:.84rem;font-weight:300;font-style:italic;}",

    /* ---------- the invitation card ---------- */
    ".card{position:relative;background:var(--paper);border:1px solid var(--rule);color:var(--ink);box-shadow:var(--drop);margin-top:4px;animation:rise .48s cubic-bezier(.2,.8,.3,1) both;}",
    ".card__strip{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 16px;background:#191512;color:var(--paper);font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.62rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;}",
    ".card__strip span:last-child{opacity:.62;}",
    ".card__stage{padding:26px 26px 0;display:flex;justify-content:center;}",
    ".poster{position:relative;width:212px;height:236px;border-radius:999px 999px 5px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;background:var(--tone);color:var(--paper);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 10px 22px rgba(8,7,6,.24);}",
    ".poster::after{content:'';position:absolute;inset:7px;border-radius:999px 999px 3px 3px;border:1px solid rgba(247,241,229,.32);pointer-events:none;}",
    ".poster__art{font-size:2.5rem;letter-spacing:.04em;filter:drop-shadow(0 3px 7px rgba(0,0,0,.28));}",
    ".bignum{display:flex;flex-direction:column;align-items:center;line-height:.94;font-family:'Jost','Noto Sans TC',sans-serif;font-weight:600;font-size:2.85rem;letter-spacing:.02em;font-variant-numeric:tabular-nums;}",
    ".bignum small{font-family:'IBM Plex Mono',monospace;font-size:.22em;letter-spacing:.3em;font-weight:500;opacity:.8;margin-top:9px;}",
    ".card__body{padding:22px 26px 24px;text-align:center;}",
    "@media (max-width:560px){.card__body{padding:20px 17px;}.card__stage{padding:20px 17px 0;}.poster{width:188px;height:210px;}.bignum{font-size:2.5rem;}}",
    ".card__from{font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.65rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--terra);margin-bottom:10px;}",
    ".card__title{font-family:'Jost','Noto Serif TC',serif;font-weight:900;font-size:1.62rem;line-height:1.32;text-wrap:balance;}",
    "@media (max-width:560px){.card__title{font-size:1.36rem;}}",
    ".card__said{font-size:.93rem;font-weight:300;font-style:italic;color:var(--ink-2);background:var(--paper-2);border-left:2px solid var(--terra);padding:11px 15px;margin-top:16px;text-align:left;line-height:1.75;}",

    /* ---------- credits block ---------- */
    ".credits{text-align:left;margin-top:20px;border-top:1px solid var(--rule);padding-top:16px;}",
    ".credits__scene{display:grid;grid-template-columns:70px 1fr;gap:10px 13px;padding:11px 0;border-bottom:1px dashed var(--rule-soft);}",
    ".credits__scene:last-of-type{border-bottom:1px solid var(--rule);}",
    ".credits__no{font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.62rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);padding-top:3px;}",
    ".credits__what{font-family:'Jost','Noto Serif TC',serif;font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;margin-bottom:5px;}",
    ".credits__det{display:grid;grid-template-columns:42px 1fr;gap:3px 10px;font-size:.84rem;}",
    ".credits__k{font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.65rem;letter-spacing:.1em;color:var(--ink-3);padding-top:3px;}",
    ".credits__v{color:var(--ink-2);font-weight:300;line-height:1.55;}",
    ".credits__when{display:grid;grid-template-columns:70px 1fr;gap:10px 13px;padding-top:14px;}",
    ".credits__big{font-family:'IBM Plex Mono',monospace;font-size:1.1rem;font-weight:600;color:var(--ink);}",
    ".credits__sm{font-size:.83rem;color:var(--ink-2);font-weight:300;}",

    /* ---------- stamp ---------- */
    ".stamp{position:absolute;top:196px;right:16px;z-index:5;transform:rotate(-11deg);border:2.5px solid var(--terra);color:var(--terra);padding:6px 13px;font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.73rem;font-weight:600;letter-spacing:.22em;background:rgba(247,241,229,.86);opacity:.94;animation:stampIn .5s cubic-bezier(.3,1.5,.5,1) .35s both;}",
    "@keyframes stampIn{from{opacity:0;transform:rotate(-11deg) scale(2);}to{opacity:.94;transform:rotate(-11deg) scale(1);}}",
    "@media (max-width:560px){.stamp{top:172px;right:10px;font-size:.66rem;}}",

    ".acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px;}",

    /* ---------- share row ---------- */
    ".share{display:flex;margin-top:18px;border:1px solid var(--rule);}",
    ".share input{flex:1 1 auto;min-width:0;background:var(--paper-2);border:none;padding:10px 12px;font-family:'IBM Plex Mono',monospace;font-size:.71rem;color:var(--ink-2);}",
    ".share input:focus{outline:none;background:#fffdf8;}",
    ".share button{flex:none;border-left:1px solid var(--rule);padding:10px 15px;font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.69rem;font-weight:600;letter-spacing:.11em;background:var(--paper);transition:background .16s,color .16s;}",
    ".share button:hover{background:var(--ink);color:var(--paper);}",

    /* ---------- availability grid ---------- */
    ".gscroll{overflow-x:auto;border:1px solid var(--rule);}",
    ".grid{display:grid;grid-template-columns:58px repeat(var(--cols),minmax(54px,1fr));touch-action:none;width:max-content;min-width:100%;}",
    ".g-corner{position:sticky;left:0;top:0;z-index:3;background:var(--paper-2);border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);}",
    ".g-date{position:sticky;top:0;z-index:2;background:var(--paper-2);border-bottom:1px solid var(--rule);border-left:1px solid var(--rule-soft);text-align:center;font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.69rem;font-weight:600;padding:8px 2px;}",
    ".g-time{position:sticky;left:0;z-index:1;background:var(--paper-2);border-right:1px solid var(--rule);border-top:1px solid var(--rule-soft);text-align:right;padding:0 8px;font-family:'IBM Plex Mono',monospace;font-size:.67rem;color:var(--ink-2);display:flex;align-items:center;justify-content:flex-end;}",
    ".g-cell{position:relative;border-top:1px solid var(--rule-soft);border-left:1px solid var(--rule-soft);min-height:33px;background:color-mix(in srgb,var(--heat-full) calc(var(--heat)*72%),var(--heat-base) calc((1 - var(--heat))*100%));display:flex;align-items:center;justify-content:center;user-select:none;transition:box-shadow .12s;}",
    ".g-cell:hover{box-shadow:inset 0 0 0 2px var(--ink);}",
    ".g-cell.mine{box-shadow:inset 0 0 0 2px var(--ink);}",
    ".g-cell.mine::after{content:'';position:absolute;inset:4px;border:1px dashed var(--ink);pointer-events:none;opacity:.6;}",
    ".g-cell--off{background:repeating-linear-gradient(45deg,var(--paper-2),var(--paper-2) 4px,var(--paper-3) 4px,var(--paper-3) 8px);opacity:.6;}",
    ".g-n{font-family:'IBM Plex Mono',monospace;font-size:.67rem;font-weight:600;color:var(--ink);}",
    ".legend{display:flex;align-items:center;gap:7px;margin-top:11px;font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.67rem;color:var(--ink-2);}",
    ".legend__sw{width:15px;height:15px;border:1px solid var(--rule);}",
    ".peek{margin-top:11px;padding:10px 14px;background:var(--paper-2);border-left:2px solid var(--ink-3);font-size:.84rem;min-height:2.4em;font-weight:300;}",
    ".peek b{font-family:'IBM Plex Mono',monospace;color:var(--terra-2);font-weight:600;}",

    /* ---------- editor ---------- */
    ".editor{margin-top:18px;padding-top:17px;border-top:1px solid var(--rule);}",
    ".grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(156px,1fr));gap:13px;margin-bottom:14px;}",
    ".f{display:flex;flex-direction:column;gap:5px;}",
    ".f--wide{grid-column:1/-1;}",
    ".f label{font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.64rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);}",
    ".f input,.f textarea,.f select{background:var(--paper-2);border:1px solid var(--rule-soft);border-bottom:2px solid var(--rule);padding:9px 11px;font-size:.89rem;color:var(--ink);transition:border-color .18s,background .18s;}",
    ".f input:focus,.f textarea:focus,.f select:focus{outline:none;border-bottom-color:var(--terra);background:#fffdf8;}",
    ".f textarea{resize:vertical;min-height:60px;}",

    /* ---------- results ---------- */
    ".best{display:flex;flex-wrap:wrap;gap:9px;}",
    ".best__b{background:var(--paper-2);border:1px solid var(--rule);padding:11px 16px;min-width:132px;}",
    ".best__b:first-child{background:var(--ink);color:var(--paper);border-color:var(--ink);}",
    ".best__no{font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.57rem;letter-spacing:.16em;opacity:.62;}",
    ".best__t{display:block;font-family:'IBM Plex Mono',monospace;font-size:.86rem;font-weight:600;margin:2px 0 1px;}",
    ".best__c{display:block;font-size:.72rem;opacity:.78;font-weight:300;}",
    ".tally{display:grid;grid-template-columns:8.5em 1fr 2.6em;align-items:center;gap:10px;margin-bottom:8px;font-size:.84rem;}",
    ".tally__bar{background:var(--paper-3);height:8px;overflow:hidden;}",
    ".tally__fill{height:100%;background:var(--tone,var(--terra));transition:width .6s cubic-bezier(.2,.8,.3,1);}",
    ".tally__n{font-family:'IBM Plex Mono',monospace;font-size:.74rem;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums;}",
    ".people{display:flex;flex-direction:column;gap:9px;}",
    ".person{border:1px solid var(--rule-soft);background:var(--paper-2);padding:11px 14px;}",
    ".person__top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}",
    ".person__id{display:flex;align-items:center;gap:9px;}",
    ".av{width:29px;height:34px;border-radius:999px 999px 3px 3px;background:var(--av);color:var(--paper);font-family:'Jost',sans-serif;font-size:.75rem;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;}",
    ".person__n{font-weight:600;}",
    ".person__m{font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.67rem;color:var(--ink-2);}",
    ".person__chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}",
    ".person__note{margin-top:7px;font-size:.82rem;color:var(--ink-2);font-weight:300;font-style:italic;}",
    ".person__acts{display:flex;gap:9px;}",
    ".sugg{display:flex;flex-direction:column;gap:8px;}",
    ".sugg__i{border-left:2px solid var(--terra);background:var(--paper-2);padding:9px 14px;font-size:.87rem;}",

    /* ---------- checklist ---------- */
    ".todo{display:flex;flex-direction:column;gap:2px;}",
    ".todo__i{display:flex;align-items:center;gap:11px;font-size:.88rem;padding:7px 6px;cursor:pointer;transition:background .14s;}",
    ".todo__i:hover{background:var(--paper-2);}",
    ".todo__i.done{color:var(--ink-3);text-decoration:line-through;}",
    ".todo__b{width:18px;height:18px;flex:none;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;font-size:.71rem;color:var(--paper);transition:background .16s,border-color .16s;}",
    ".todo__i.done .todo__b{background:var(--ink);border-color:var(--ink);}",

    "details{margin-top:9px;border-top:1px solid var(--rule-soft);padding-top:9px;}",
    "summary{cursor:pointer;font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.7rem;font-weight:500;letter-spacing:.12em;color:var(--ink-2);padding:5px 0;}",
    "summary:hover{color:var(--ink);}",
    "summary:focus-visible{outline:2px solid var(--terra);outline-offset:2px;}",
    ".details-body{padding-top:11px;}",
    ".addrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}",
    ".addrow input{background:var(--paper-2);border:1px solid var(--rule);padding:8px 10px;font-family:'IBM Plex Mono',monospace;font-size:.81rem;color:var(--ink);}",

    ".foot{text-align:center;color:var(--glow-3);font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:.67rem;letter-spacing:.12em;margin-top:30px;line-height:2;text-shadow:0 1px 10px rgba(6,5,4,.7);}",
  ].join("\n");

  /* ================= GROUP ================= */
  function computeCounts(g) {
    var counts = {}, names = {};
    g.responses.forEach(function (r) {
      r.slots.forEach(function (sid) { counts[sid] = (counts[sid] || 0) + 1; (names[sid] = names[sid] || []).push(r.name); });
    });
    var max = 0; Object.keys(counts).forEach(function (k) { if (counts[k] > max) max = counts[k]; });
    return { counts: counts, names: names, max: max };
  }
  function computeBest(counts, limit) {
    var entries = Object.keys(counts.counts).map(function (sid) {
      var p = sid.split("|"); return { sid: sid, date: p[0], time: p[1], count: counts.counts[sid] };
    });
    entries.sort(function (a, b) { return b.count - a.count || a.sid.localeCompare(b.sid); });
    return entries.filter(function (e) { return e.count > 0; }).slice(0, limit || 3);
  }
  function computeTally(g, field, catKey) {
    var tally = {};
    g.responses.forEach(function (r) {
      ((r[field] && r[field][catKey]) || []).forEach(function (v) { tally[v] = (tally[v] || 0) + 1; });
    });
    var total = g.responses.length || 1;
    return Object.keys(tally).map(function (k) { return { label: k, count: tally[k], pct: Math.round((tally[k] / total) * 100) }; })
      .sort(function (a, b) { return b.count - a.count; });
  }
  function findResponseByName(g, name) {
    var low = name.trim().toLowerCase();
    for (var i = 0; i < g.responses.length; i++) if (g.responses[i].name.trim().toLowerCase() === low) return g.responses[i];
    return null;
  }
  function upsertResponse(g, resp) {
    var idx = -1;
    for (var i = 0; i < g.responses.length; i++) {
      var r = g.responses[i];
      if (r.id === resp.id || r.name.trim().toLowerCase() === resp.name.trim().toLowerCase()) { idx = i; break; }
    }
    if (idx >= 0) g.responses[idx] = resp; else g.responses.push(resp);
  }
  function renderGroup() {
    if (state.group) return topbar(true) + renderGroupMain(orderedCats(state.group.categories));
    return topbar(false) + renderGroupSetup(orderedCats(navCategories));

  function syncGlobalDraftFromDom() {

  function syncPerDayDraftFromDom() {

  function renderSetupArea(cats) {

  function renderGroupGrid(g, cats, counts) {
    var slots = allTimeRows(g);
    var editing = !!draft && !readOnly;
    var rows = "";
    slots.forEach(function (t) {
      rows += '<div class="g-time">' + t + "</div>";
      g.dates.forEach(function (d) {
        var w = windowFor(g, d);
        if (t < w.start || t >= w.end) { rows += '<div class="g-cell g-cell--off" aria-hidden="true"></div>'; return; }
        var sid = slotId(d, t);
        var count = counts.counts[sid] || 0;
        var heat = counts.max ? count / counts.max : 0;
        var mine = draft && draft.slots.has(sid);
        rows += '<button type="button" class="g-cell' + (mine ? " mine" : "") + '" style="--heat:' + heat.toFixed(3) + '" data-action="' + (editing ? "toggle-slot" : "peek-slot") + '" data-slot="' + sid + '" aria-pressed="' + (mine ? "true" : "false") + '" aria-label="' + esc(formatDateLabel(d)) + " " + t + "，" + count + '人可以">' + (count > 0 ? '<span class="g-n">' + count + "</span>" : "") + "</button>";
      });
    });
    var header = '<div class="g-corner"></div>' + g.dates.map(function (d) { return '<div class="g-date">' + esc(formatDateLabel(d)) + "</div>"; }).join("");
    return (
      '<div class="sec"><div class="sec__head"><h2 class="sec__title">大家的空檔</h2>' +
      '<span class="sec__hint">' + (editing ? "點格子，或直接拖過去" : "顏色越深代表越多人可以") + "</span></div>" +
      '<div class="gscroll"><div class="grid" style="--cols:' + g.dates.length + '">' + header + rows + "</div></div>" +
      '<div class="legend"><span>少</span>' +

  /* ================= top-level render ================= */
  function renderApp() {
    var root = document.getElementById("app");
    setScene(currentScene());
    var html = renderBanner();
    if (state.solo) html += renderSolo();
    else if (state.group) html += renderGroup();
    else if (!navMode) html += topbar(true) + renderHome();
    else if (navMode === "solo") html += renderSoloCompose();
    else if (!navSetupOpen) html += renderGroupCategoryPicker();
    else html += renderGroup();
    root.innerHTML = html;
    var shareInput = document.getElementById("shareUrlInput");
    if (shareInput) shareInput.value = location.href;
  }

  /* ================= sync ================= */
  function publishState(newState) {
    state = newState; draft = null; soloDraft = null; soloStep = 0; composeDraft = null;
    renderApp();                       // show it instantly; never make anyone wait on the network
    syncToRemote(newState);
  }
  function syncToRemote(stateObj) {
    var task = blobId
      ? putRemote(blobId, stateObj)
      : createRemote(stateObj).then(function (id) { blobId = id; setIdInUrl(id); startPolling(); renderApp(); });
    task.then(function () {
      lastFailedSync = null;
      if (banner && banner.type === "error") { banner = null; renderApp(); }
    }).catch(function (err) {
      lastFailedSync = stateObj;
      banner = { type: "error", text: "剛剛的更新沒同步出去（" + (err && err.message ? err.message : "網路不太順") + "）。你看到的內容還在，但對方可能還沒收到。" };
      renderApp();
    });
  }
  function submitGroupResponse(resp) {
    // Two people can submit seconds apart; a blind read-modify-write off stale
    // local state would let the second one wipe the first (PUT replaces the
    // whole blob). Re-read the freshest copy right before merging.
    function mergeInto(base) {
      var ns = cloneState(base);
      if (!ns.group) ns = cloneState(state);
      upsertResponse(ns.group, resp);
      publishState(ns);
    }
    if (blobId) fetchRemote(blobId).then(mergeInto).catch(function () { mergeInto(state); });
    else mergeInto(state);
  }
  function isActivelyEditing() {
    return !!soloDraft || !!draft || (!!navMode && !state.solo && !state.group);
  }
  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(function () {
      if (!blobId || isActivelyEditing()) return;
      fetchRemote(blobId).then(function (remote) {
        if (JSON.stringify(remote) !== JSON.stringify(state)) { state = remote; renderApp(); }
      }).catch(function () { /* transient hiccup — try again next tick */ });
    }, POLL_MS);
  }

  /* ================= interactions ================= */
  function armButton(btn, label) {
    if (!btn.dataset.origLabel) btn.dataset.origLabel = btn.textContent;
    btn.textContent = label;
    btn.dataset.armed = "1";
    clearTimeout(btn._armTimer);
    btn._armTimer = setTimeout(function () { btn.textContent = btn.dataset.origLabel; btn.dataset.armed = "0"; }, 4000);
  }
  function flashButton(btn, label) {
    if (!btn.dataset.origLabel) btn.dataset.origLabel = btn.textContent;
    btn.textContent = label;
    clearTimeout(btn._armTimer);
    btn._armTimer = setTimeout(function () { btn.textContent = btn.dataset.origLabel; }, 1800);
  }
  function copyShare(btn) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(location.href).then(function () { flashButton(btn, "複製好了 ✓"); }).catch(fallback);
    } else fallback();
    function fallback() {
      var inp = document.getElementById("shareUrlInput");
      if (inp) { inp.focus(); inp.select(); try { document.execCommand("copy"); flashButton(btn, "複製好了 ✓"); } catch (e) { flashButton(btn, "請手動複製"); } }
    }
  }
  function showPeek(g, sid) {
    var counts = computeCounts(g);
    var parts = sid.split("|");
    var names = counts.names[sid] || [];
    var panel = document.getElementById("peekPanel");
    if (!panel) return;
    panel.innerHTML = "<b>" + esc(formatDateLabel(parts[0])) + " " + parts[1] + "</b>　" + (names.length ? names.map(esc).join("、") + " 可以" : "這個時段還沒有人可以");
  }

  function onClick(e) {
    var btn = e.target.closest("[data-action]");
    if (!btn) return;
    var action = btn.dataset.action;

    /* --- local-only navigation: instant, never touches the network --- */
    if (action === "pick-mode") {
      navMode = btn.dataset.mode; navCategories = new Set(); navSetupOpen = false;
      if (navMode === "solo" && !composeDraft) composeDraft = { inviterName: "", inviteeName: "", note: "" };
      renderApp(); return;
    }
    if (action === "back-home") {
      navMode = null; navCategories = new Set(); navSetupOpen = false; composeDraft = null;
      renderApp(); return;
    }
    if (action === "toggle-nav-cat") {
      var nk = btn.dataset.category;
      if (navCategories.has(nk)) navCategories.delete(nk); else navCategories.add(nk);
      var ne = document.getElementById("navError"); if (ne) ne.textContent = "";
      renderApp(); return;
    }
    if (action === "confirm-cats") {
      if (!navCategories.size) { var ne2 = document.getElementById("navError"); if (ne2) ne2.textContent = "至少挑一種吧"; return; }
      navSetupOpen = true;
      setupDates = new Set(); perDayMode = false; perDayDraft = {}; globalDraft = {}; calCursor = null;
      renderApp(); return;
    }
    if (action === "copy-link") { copyShare(btn); return; }
    if (action === "retry-sync") { if (lastFailedSync) syncToRemote(lastFailedSync); return; }

    /* --- solo: the inviter's one and only job --- */
    if (action === "solo-send") {
      var inviter = ((document.getElementById("composeInviter") || {}).value || "").trim();
      var invitee = ((document.getElementById("composeInvitee") || {}).value || "").trim();
      var cnote = ((document.getElementById("composeNote") || {}).value || "").trim();
      if (!inviter) { var ce = document.getElementById("composeError"); if (ce) ce.textContent = "先寫個名字吧，他才知道是誰"; return; }
      var nsC = cloneState(state);
      nsC.solo = { inviterName: inviter, inviteeName: invitee, note: cnote, categories: [], picks: {}, vibes: {}, date: null, time: null, place: null, responded: false, answer: null, replyNote: "", createdAt: Date.now() };
      try { sessionStorage.setItem("solo_is_creator", "1"); } catch (e0) {}
      composeDraft = null;
      publishState(nsC);
      return;
    }

    /* --- solo: everything from here is the recipient tapping --- */
    if (action === "solo-accept") {
      soloDraft = { categories: new Set(), picks: {}, vibes: {}, date: "", time: "", customTime: false, place: "", note: "" };
      soloStep = 0; renderApp(); return;
    }
    if (action === "solo-decline") {
      var nsD = cloneState(state);
      nsD.solo.responded = true; nsD.solo.answer = "no"; nsD.solo.respondedAt = Date.now();
      publishState(nsD); return;
    }
    if (action === "wiz-toggle-cat") {
      var wk = btn.dataset.category;
      if (soloDraft.categories.has(wk)) soloDraft.categories.delete(wk); else soloDraft.categories.add(wk);
      var we = document.getElementById("wizError"); if (we) we.textContent = "";
      renderApp(); return;
    }
    if (action === "wiz-toggle") {
      var field = btn.dataset.field, value = btn.dataset.value, ck = btn.dataset.cat;
      soloDraft[field][ck] = soloDraft[field][ck] || new Set();
      var set = soloDraft[field][ck];
      if (set.has(value)) set.delete(value); else set.add(value);
      btn.setAttribute("aria-pressed", set.has(value) ? "true" : "false");
      return;
    }
    if (action === "wiz-time") { soloDraft.time = btn.dataset.time; soloDraft.customTime = false; renderApp(); return; }
    if (action === "wiz-time-custom") {
      soloDraft.customTime = true; renderApp();
      setTimeout(function () { var el = document.getElementById("wizCustomTime"); if (el) el.focus(); }, 0);
      return;
    }
    if (action === "wiz-prev") { collectWizStep(); soloStep = Math.max(0, soloStep - 1); renderApp(); return; }
    if (action === "wiz-next") {
      var err = validateWizStep();
      if (err) { var e1 = document.getElementById("wizError"); if (e1) e1.textContent = err; return; }
      collectWizStep(); soloStep = Math.min(soloSteps().length - 1, soloStep + 1); renderApp(); return;
    }
    if (action === "wiz-finish") {
      var err2 = validateWizStep();
      if (err2) { var e2 = document.getElementById("wizError"); if (e2) e2.textContent = err2; return; }
      collectWizStep();
      var d = soloDraft;
      var ns2 = cloneState(state);
      ns2.solo.categories = Array.from(orderedCats(d.categories).map(function (c) { return c.key; }));
      ns2.solo.picks = setMapToArrays(d.picks);
      ns2.solo.vibes = setMapToArrays(d.vibes);
      ns2.solo.date = d.date; ns2.solo.time = d.time; ns2.solo.place = d.place;
      ns2.solo.replyNote = d.note;
      ns2.solo.responded = true; ns2.solo.answer = "yes"; ns2.solo.respondedAt = Date.now();
      soloDraft = null; soloStep = 0;
      publishState(ns2);
      return;
    }
    if (action === "solo-reset") {
      if (btn.dataset.armed === "1") {
        clearTimeout(btn._armTimer);
        var ns6 = cloneState(state); ns6.solo = null;
        soloDraft = null; soloStep = 0; composeDraft = null; navMode = null; navCategories = new Set(); navSetupOpen = false;
        try { sessionStorage.removeItem("solo_is_creator"); } catch (e6) {}
        publishState(ns6);
      } else armButton(btn, "確定？再按一次");
      return;
    }

    /* --- calendar --- */
    if (action === "cal-nav") {
      ensureCalCursor();
      var dir = parseInt(btn.dataset.dir, 10);
      calCursor.m += dir;
      if (calCursor.m < 0) { calCursor.m = 11; calCursor.y--; }
      else if (calCursor.m > 11) { calCursor.m = 0; calCursor.y++; }
      if (btn.dataset.calMode === "multi") refreshSetupArea(orderedCats(navCategories));
      else renderApp();
      return;
    }
    if (action === "cal-pick") {
      var iso = btn.dataset.date;
      if (btn.dataset.mode === "single") { soloDraft.date = iso; renderApp(); return; }
      if (setupDates.has(iso)) setupDates.delete(iso); else setupDates.add(iso);
      refreshSetupArea(orderedCats(navCategories));
      return;
    }

    /* --- group setup --- */
    if (action === "toggle-per-day") {
      syncGlobalDraftFromDom(); syncPerDayDraftFromDom();
      perDayMode = !perDayMode;
      refreshSetupArea(orderedCats(navCategories));
      return;
    }
    if (action === "remove-date") {
      setupDates.delete(btn.dataset.date);
      delete perDayDraft[btn.dataset.date];
      refreshSetupArea(orderedCats(navCategories));
      return;
    }
    if (action === "create-event") {
      var cats = orderedCats(navCategories);
      var def = groupDefaults(cats);
      var title = document.getElementById("setupTitle").value.trim();
      var desc = document.getElementById("setupDesc").value.trim();
      var dates = Array.from(setupDates).sort();
      var errE = document.getElementById("setupError");
      if (!dates.length) { errE.textContent = "至少挑一天候選日"; return; }
      var interval = parseInt((document.getElementById("setupInterval") || {}).value, 10) || def.step;
      var ts, te, dateWindows = {};
      if (perDayMode) {
        syncPerDayDraftFromDom();
        var allOk = true;
        dates.forEach(function (d) {
          var ov = perDayDraft[d] || {};
          var s = ov.start || def.start, en = ov.end || def.end;
          if (s >= en) allOk = false;
          dateWindows[d] = { start: s, end: en };
        });
        if (!allOk) { errE.textContent = "有一天的結束時間比開始還早，檢查一下"; return; }
        var starts = dates.map(function (d) { return dateWindows[d].start; }).sort();
        var ends = dates.map(function (d) { return dateWindows[d].end; }).sort();
        ts = starts[0]; te = ends[ends.length - 1];
      } else {
        syncGlobalDraftFromDom();
        ts = globalDraft.start || def.start;
        te = globalDraft.end || def.end;
        if (ts >= te) { errE.textContent = "結束時間要比開始晚才行"; return; }
      }
      errE.textContent = "";
      var ns7 = cloneState(state);
      ns7.group = {
        categories: cats.map(function (c) { return c.key; }),
        meta: { title: title || catNames(cats), description: desc },
        dates: dates, timeStart: ts, timeEnd: te, slotMinutes: interval, dateWindows: dateWindows, responses: [],
      };
      publishState(ns7);
      return;
    }

    /* --- group grid + editor --- */
    if (action === "start-edit") {
      draft = { editingId: null, name: "", slots: new Set(), picks: {}, vibes: {}, place: "", placeNote: "", note: "" };
      banner = null; renderApp();
      var nm = document.getElementById("draftName"); if (nm) nm.focus();
      return;
    }
    if (action === "cancel-edit") { draft = null; renderApp(); return; }
    if (action === "edit-participant") {
      var r = state.group.responses.find(function (x) { return x.id === btn.dataset.id; });
      if (!r) return;
      draft = {
        editingId: r.id, name: r.name, slots: new Set(r.slots),
        picks: arraysToSetMap(r.picks), vibes: arraysToSetMap(r.vibes),
        place: (r.suggestion && r.suggestion.place) || "", placeNote: (r.suggestion && r.suggestion.note) || "", note: r.note || "",
      };
      banner = null; renderApp();
      return;
    }
    if (action === "toggle-chip") {
      if (!draft) return;
      var f2 = btn.dataset.field, v2 = btn.dataset.value, c2 = btn.dataset.cat;
      draft[f2][c2] = draft[f2][c2] || new Set();
      var s2 = draft[f2][c2];
      if (s2.has(v2)) s2.delete(v2); else s2.add(v2);
      btn.setAttribute("aria-pressed", s2.has(v2) ? "true" : "false");
      return;
    }
    if (action === "peek-slot") { showPeek(state.group, btn.dataset.slot); return; }
    if (action === "submit-response") {
      var nameInput = document.getElementById("draftName");
      var name = nameInput.value.trim();
      var errEl = document.getElementById("draftError");
      if (!name) { errEl.textContent = "先寫個名字，大家才知道是你"; nameInput.focus(); return; }
      if (!draft.slots.size) { errEl.textContent = "至少標一個你可以的時段"; return; }
      errEl.textContent = "";
      var resp = {
        id: draft.editingId || (findResponseByName(state.group, name) || {}).id || uid(),
        name: name, slots: Array.from(draft.slots),
        picks: setMapToArrays(draft.picks), vibes: setMapToArrays(draft.vibes),
        suggestion: { place: document.getElementById("draftPlace").value.trim(), note: document.getElementById("draftPlaceNote").value.trim() },
        note: document.getElementById("draftNote").value.trim(), updatedAt: Date.now(),
      };
      draft = null; banner = null;
      submitGroupResponse(resp);
      return;
    }
    if (action === "add-more-date") {
      var mi = document.getElementById("moreDateInput");
      if (!mi || !mi.value) return;
      if (state.group.dates.indexOf(mi.value) !== -1) { mi.value = ""; return; }
      var ns9 = cloneState(state); ns9.group.dates = ns9.group.dates.concat([mi.value]).sort(); mi.value = "";
      publishState(ns9);
      return;
    }
    if (action === "reset-event") {
      if (btn.dataset.armed === "1") {
        clearTimeout(btn._armTimer);
        var ns10 = cloneState(state); ns10.group = null;
        setupDates = new Set(); perDayMode = false; perDayDraft = {}; globalDraft = {}; calCursor = null;
        navMode = null; navCategories = new Set(); navSetupOpen = false;
        publishState(ns10);
      } else armButton(btn, "確定清掉？再按一次");
      return;
    }
    if (action === "delete-participant") {
      if (btn.dataset.armed === "1") {
        clearTimeout(btn._armTimer);
        var ns11 = cloneState(state);
        ns11.group.responses = ns11.group.responses.filter(function (x) { return x.id !== btn.dataset.id; });
        publishState(ns11);
      } else armButton(btn, "確定刪？");
      return;
    }
    if (action === "toggle-todo") {
      var idx = parseInt(btn.dataset.idx, 10);
      if (checkedNecessities.has(idx)) checkedNecessities.delete(idx); else checkedNecessities.add(idx);
      var on = checkedNecessities.has(idx);
      btn.classList.toggle("done", on);
      var box = btn.querySelector(".todo__b"); if (box) box.textContent = on ? "✓" : "";
      return;
    }
  }
  document.addEventListener("click", onClick);

  function validateWizStep() {
    var st = soloSteps()[soloStep];
    if (!st) return null;
    if (st.k === "cat" && !soloDraft.categories.size) return "先挑一種吧，可以複選";
    if (st.k === "tags") {
      var set = soloDraft.picks[st.cat];
      if (!set || !set.size) return "至少選一個";
    }
    if (st.k === "date" && !soloDraft.date) return "先挑一天";
    if (st.k === "time") {
      if (soloDraft.customTime) { var tv = (document.getElementById("wizCustomTime") || {}).value; if (!tv) return "填一個時間"; }
      else if (!soloDraft.time) return "挑一個時間";
    }
    return null;
  }
  function collectWizStep() {
    var st = soloSteps()[soloStep];
    if (!st) return;
    if (st.k === "time" && soloDraft.customTime) { var tv = (document.getElementById("wizCustomTime") || {}).value; if (tv) soloDraft.time = tv; }
    if (st.k === "place") { var p = document.getElementById("wizPlace"); if (p) soloDraft.place = p.value.trim(); }
    if (st.k === "note") { var n = document.getElementById("wizNote"); if (n) soloDraft.note = n.value.trim(); }
  }

  /* ================= drag-select on the grid ================= */
  function applySlot(cell, sid, value) {
    if (!draft) return;
    if (value) draft.slots.add(sid); else draft.slots.delete(sid);
    cell.classList.toggle("mine", value);
    cell.setAttribute("aria-pressed", value ? "true" : "false");
  }
  function paintCellAt(x, y) {
    var el = document.elementFromPoint(x, y);
    var cell = el && el.closest ? el.closest(".g-cell") : null;
    if (!cell || cell.classList.contains("g-cell--off")) return;
    var sid = cell.dataset.slot;
    if (sid === dragState.lastSid) return;
    dragState.lastSid = sid;
    applySlot(cell, sid, dragState.paint);
  }
  document.addEventListener("pointerdown", function (e) {
    if (readOnly) return;
    var cell = e.target.closest(".g-cell");
    if (!cell || cell.classList.contains("g-cell--off")) return;
    var sid = cell.dataset.slot;
    var firstTap = !draft;
    if (firstTap) {
      // tapping a slot before anyone has pressed "start" should just start
      // for them — that first tap already counts as their own time. Defer
      // the full re-render (which reveals the name/detail fields below the
      // grid) to right after this click finishes, so we never swap out the
      // element mid-gesture.
      draft = { editingId: null, name: "", slots: new Set(), picks: {}, vibes: {}, place: "", placeNote: "", note: "" };
    }
    dragState = { paint: !draft.slots.has(sid), lastSid: sid };
    applySlot(cell, sid, dragState.paint);
    if (firstTap) setTimeout(renderApp, 0);
    e.preventDefault();
  });
  document.addEventListener("pointermove", function (e) { if (dragState) paintCellAt(e.clientX, e.clientY); });
  document.addEventListener("pointerup", function () { dragState = null; });
  document.addEventListener("pointercancel", function () { dragState = null; });

  /* ================= boot ================= */
  function boot() {
    document.getElementById("app-style").textContent = CSS_TEXT;
    var id = getIdFromUrl();
    if (!id) { state = emptyState(); renderApp(); return; }
    blobId = id;
    banner = { type: "info", text: "正在把這個連結的內容讀出來…" };
    renderApp();
    fetchRemote(id).then(function (remote) {
      state = remote && typeof remote === "object" ? remote : emptyState();
      banner = null;
      renderApp();
      startPolling();
    }).catch(function (err) {
      state = emptyState();
      banner = { type: "error", text: "讀不到這個連結的內容（" + (err && err.message ? err.message : "網路不太順") + "）。可能是連結有誤，或內容已經被清掉了。" };
      renderApp();
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
